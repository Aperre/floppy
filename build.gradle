plugins {
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "dev.architectury.loom" version "${loom_version}" apply false
    id "net.neoforged.moddev" version "2.0.148" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

def modernMinecraft = minecraft_version.startsWith("26.")

architectury {
    minecraft = minecraft_version
}

subprojects {
    // NeoForge 26.x is built with ModDevGradle instead of Architectury Loom:
    // Loom 1.17 cannot read the new NeoForge userdev/binpatcher format.
    if (!(project.name == "neoforge" && modernMinecraft)) {
        apply plugin: "dev.architectury.loom"

        loom {
            silentMojangMappingsLicense()

            if (modernMinecraft) {
                // Minecraft 26.x is shipped deobfuscated, so the mod is compiled
                // and packaged against the named (Mojang) namespace directly.
                productionNamespace = "named"
                noIntermediateMappings()
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    group "me.shedaniel"
    base {
        archivesName = rootProject.name
    }
    version = rootProject.mod_version

    repositories {
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.terraformersmc.com/releases" }
        maven { url "https://repo.spongepowered.org/repository/maven-public/" }
    }

    java {
        toolchain {
            // Minecraft 26.x requires Java 25 at runtime. Keep the emitted
            // bytecode at Java 21 below so the same sources can still build for
            // 1.21.x.
            languageVersion = JavaLanguageVersion.of(modernMinecraft ? 25 : 21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = modernMinecraft ? 25 : 21
    }

    tasks.withType(ProcessResources) {
        def mixinJavaVersion = modernMinecraft ? "25" : "21"
        inputs.property "mixin_java_version", mixinJavaVersion

        filesMatching("floppy.mixins.json") {
            expand(java_version: mixinJavaVersion)
        }
    }
}
