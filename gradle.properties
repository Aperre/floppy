# Sets default memory used by Gradle. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# read more at https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Default Minecraft target used by a normal local build.
# The CI matrix overrides this to produce the second Fabric variant.
minecraft_version=1.21.1

# NeoForge's version range (kept separate from Fabric's SemVer range).
minecraft_version_range=[1.21.1]

# Fabric metadata range for the default 1.21.1 build.
# CI overrides this for the 1.21.10-1.21.11 build.
fabric_minecraft_version_range=>=1.21.1 <1.21.9

# The NeoForge version must agree with minecraft_version for a NeoForge build.
neo_version=21.1.219
loader_version_range=[1,)

fabric_api_version=0.116.8+1.21.1
loader_version=0.18.4
loom_version=1.17-SNAPSHOT

# Mod properties
mod_id=floppy
mod_name=Floppy
mod_license=MIT
mod_version=1.0.2
mod_group_id=dev.aqpe.floppy
