plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def fabricMinecraftVersionRange = providers.gradleProperty("fabric_minecraft_version_range")
        .getOrElse(">=1.21.1 <1.21.9")

processResources {
    inputs.property "version", project.version
    inputs.property "fabric_minecraft_version_range", fabricMinecraftVersionRange

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                fabric_minecraft_version_range: fabricMinecraftVersionRange
        )
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) {
        transitive = false
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    dependsOn(shadowJar)
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = "fabric"
}

jar {
    archiveClassifier = "dev"
}
