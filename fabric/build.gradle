plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def fabricMinecraftVersionRange = providers.gradleProperty("fabric_minecraft_version_range")
        .getOrElse(">=26.1 <26.4")
def minecraftVersion = rootProject.architectury.minecraft
def isModernMinecraft = minecraftVersion.startsWith("26.")
def requiredJavaVersion = isModernMinecraft ? "25" : "21"

processResources {
    inputs.property "version", project.version
    inputs.property "fabric_minecraft_version_range", fabricMinecraftVersionRange
    inputs.property "java_version", requiredJavaVersion

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                fabric_minecraft_version_range: fabricMinecraftVersionRange,
                java_version: requiredJavaVersion
        )
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (!isModernMinecraft) {
        // Minecraft 26.x ships deobfuscated, so no mappings are needed (or published).
        mappings loom.officialMojangMappings()
    } else {
        mappings files(rootProject.file("gradle/identity-mappings.jar"))
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) {
        transitive = false
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    dependsOn(shadowJar)
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = "fabric"
}

jar {
    archiveClassifier = "dev"
}
