plugins {
    id "architectury-plugin"
    id "dev.architectury.loom"
    id "java"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

architectury {
    common("fabric", "neoforge")
}

def mcParts = minecraft_version.tokenize('.').collect { it as int }
def fishMixinName = (mcParts.size() >= 3 && mcParts[2] >= 2)
        ? "AbstractFishModernMixin"
        : "AbstractFishMixin"

processResources {
    inputs.property "fish_mixin_name", fishMixinName
    filesMatching("floppy.mixins.json") {
        expand(fish_mixin_name: fishMixinName)
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8-SNAPSHOT"

    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
}
