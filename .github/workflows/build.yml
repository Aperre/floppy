name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric:
    name: Fabric - Minecraft ${{ matrix.supported_versions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "1.21.1"
            fabric_minecraft_version_range: ">=1.21.1 <1.21.9"
            supported_versions: "1.21.1-1.21.8"
          - minecraft_version: "1.21.10"
            fabric_minecraft_version_range: ">=1.21.10 <1.21.12"
            supported_versions: "1.21.10-1.21.11"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Fabric
        run: |
          ./gradlew :fabric:build -Pfabric_only=true \
            "-Pminecraft_version=${{ matrix.minecraft_version }}" \
            "-Pfabric_minecraft_version_range=${{ matrix.fabric_minecraft_version_range }}"
      - name: Name distributable
        run: cp "fabric/build/libs/floppy-1.0.2-fabric.jar" "floppy-1.0.2-fabric-mc${{ matrix.supported_versions }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: floppy-1.0.2-fabric-mc${{ matrix.supported_versions }}
          path: floppy-1.0.2-fabric-mc${{ matrix.supported_versions }}.jar
          if-no-files-found: error

  build-neoforge:
    name: NeoForge - Minecraft ${{ matrix.supported_versions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "1.21.1"
            minecraft_version_range: "[1.21.1,1.21.9)"
            neo_version: "21.1.265"
            neo_version_range: "[21.1.1,)"
            supported_versions: "1.21.1-1.21.8"
          - minecraft_version: "1.21.10"
            minecraft_version_range: "[1.21.10,1.21.12)"
            neo_version: "21.10.64"
            neo_version_range: "[21.10.0,)"
            supported_versions: "1.21.10-1.21.11"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build NeoForge
        run: |
          ./gradlew :neoforge:build \
            "-Pminecraft_version=${{ matrix.minecraft_version }}" \
            "-Pminecraft_version_range=${{ matrix.minecraft_version_range }}" \
            "-Pneo_version=${{ matrix.neo_version }}" \
            "-Pneo_version_range=${{ matrix.neo_version_range }}"
      - name: Name distributable
        run: cp "neoforge/build/libs/floppy-1.0.2-neoforge.jar" "floppy-1.0.2-neoforge-mc${{ matrix.supported_versions }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: floppy-1.0.2-neoforge-mc${{ matrix.supported_versions }}
          path: floppy-1.0.2-neoforge-mc${{ matrix.supported_versions }}.jar
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fabric, build-neoforge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: floppy-1.0.2-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          generate_release_notes: true
