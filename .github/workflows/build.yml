name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric:
    name: Fabric - Minecraft ${{ matrix.supported_versions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "1.21.1"
            fabric_minecraft_version_range: ">=1.21.1 <1.21.9"
            supported_versions: "1.21.1-1.21.8"
          - minecraft_version: "1.21.10"
            fabric_minecraft_version_range: ">=1.21.10 <1.21.12"
            supported_versions: "1.21.10-1.21.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Fabric mod against target Minecraft version
        run: |
          ./gradlew :fabric:build \
            -Pfabric_only=true \
            "-Pminecraft_version=${{ matrix.minecraft_version }}" \
            "-Pfabric_minecraft_version_range=${{ matrix.fabric_minecraft_version_range }}"

      - name: Name distributable
        run: |
          cp "fabric/build/libs/floppy-1.0.2-fabric.jar" \
            "floppy-1.0.2-fabric-mc${{ matrix.supported_versions }}.jar"

      - name: Upload Fabric variant
        uses: actions/upload-artifact@v4
        with:
          name: floppy-1.0.2-fabric-mc${{ matrix.supported_versions }}
          path: floppy-1.0.2-fabric-mc${{ matrix.supported_versions }}.jar
          if-no-files-found: error

  build-neoforge:
    name: NeoForge - Minecraft 1.21.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge mod
        run: ./gradlew :neoforge:build

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-fabric
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both Fabric variants
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: floppy-1.0.2-fabric-mc*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          generate_release_notes: true
