pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven { url "https://maven.architectury.dev/" }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "floppy"

// Fabric CI builds compile against a selected Minecraft version. Do not include
// NeoForge in that build: the checked-in NeoForge dependency targets 1.21.1.
def fabricOnlyBuild = gradle.startParameter.projectProperties.get("fabric_only") == "true"
include("common", "fabric")
if (!fabricOnlyBuild) {
    include("neoforge")
}
